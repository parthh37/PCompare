[workspace]
resolver = "2"
members = [
    "crates/pcompare-core",
    "crates/pcompare-remote",
    "crates/pcompare-merge",
    "crates/pcompare-table",
    "crates/pcompare-picture",
    "crates/pcompare-sync",
    "crates/pcompare-meta",
    "crates/pcompare-index",
    "crates/pcompare-db",
    "crates/pcompare-convert", # bc5:converters
    "crates/pcompare-report", # bc5:reports-script
    "crates/pcompare-script", # bc5:reports-script
    "crates/pcompare-archive", # bc5:archives
    "crates/pcompare-review", # araxis:text-review
    "crates/pcompare-shell",
    "crates/pcompare-import",
    "crates/pcompare-notify", # automation
    "crates/pcompare-automation", # automation
    "src-tauri",
]

[workspace.package]
version = "1.5.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/parthh37/PCompare"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[patch.crates-io]
# Google Drive shortcuts and Docs/Sheets/Slides have no size; upstream's stat
# errors on them, which breaks listing any folder that contains one.
opendal-service-gdrive = { path = "vendor/opendal-service-gdrive" }
# Dropbox team spaces need the `Dropbox-API-Path-Root` header to reach team
# folders, and upstream drops the error details (e.g. `required_scope`).
opendal-service-dropbox = { path = "vendor/opendal-service-dropbox" }

[profile.release]
lto = true
codegen-units = 1
strip = true
