[workspace]
resolver = "2"
members = [
    "crates/pcompare-core",
    "crates/pcompare-remote",
    "crates/pcompare-merge",
    "crates/pcompare-table",
    "crates/pcompare-picture",
    "crates/pcompare-sync",
    "crates/pcompare-meta",
    "crates/pcompare-index",
    "crates/pcompare-db",
    "crates/pcompare-convert", # bc5:converters
    "crates/pcompare-report", # bc5:reports-script
    "crates/pcompare-script", # bc5:reports-script
    "crates/pcompare-archive", # bc5:archives
    "src-tauri",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/parthh37/PCompare"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
