name: Release

# Two ways to publish:
#
#   1. GitHub → Actions → Release → "Run workflow", pick a bump, Run.
#      The workflow bumps the version files, commits "Release vX.Y.Z" to main,
#      tags it, and builds that tag. Nothing to do locally.
#      (CLI equivalent: gh workflow run release.yml -f bump=minor)
#
#   2. Push a version tag yourself (any git GUI's "create tag" + push works):
#      npm run version:bump 0.2.0 && git commit -am "Release v0.2.0" && git tag v0.2.0 && git push --follow-tags
#
# Builds Windows (NSIS + MSI) and macOS (Apple Silicon + Intel DMG) installers,
# signs the updater artifacts, and publishes a GitHub release with latest.json —
# the file installed copies poll for over-the-air updates. The release stays a
# draft until every platform succeeds, so clients never see a half-built one.
#
# Required secrets:  TAURI_SIGNING_PRIVATE_KEY (+ TAURI_SIGNING_PRIVATE_KEY_PASSWORD if set)
# Optional secrets:  APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#                    APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID  (Developer ID signing + notarization)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (as-is = release the version already on main)"
        type: choice
        options: [patch, minor, major, as-is]
        default: patch
      version:
        description: "Exact version instead, e.g. 1.0.0-beta.1 (overrides bump)"
        type: string
        required: false

permissions:
  contents: write

# One release at a time: a manual run and a tag push must never race for main.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Settles which tag this run releases. A pushed tag is used as-is; a manual
  # run bumps, commits and tags main first. Pushes made with GITHUB_TOKEN don't
  # start other workflows, so the new tag doesn't kick off a second release.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Manual releases run from main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the Release workflow from the main branch (got ${GITHUB_REF})."
          exit 1
      - uses: actions/checkout@v4
      - id: tag
        env:
          KIND: ${{ inputs.version || inputs.bump }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(node scripts/version.mjs next "$KIND")
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists — pick a higher version."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! node scripts/version.mjs check "$tag" >/dev/null 2>&1; then
            node scripts/version.mjs bump "$version"
            cargo update --workspace   # rewrites the workspace crates' versions in Cargo.lock
            git commit -am "Release $tag"
          fi
          git tag "$tag"
          # Atomic: main and the tag land together or not at all.
          git push --atomic origin HEAD:main "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag from $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

  create-release:
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Tag must match app version
        run: node scripts/version.mjs check "$TAG"
      - name: Updater signing key must be configured
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY repository secret (see README → Releasing)."
            exit 1
          fi
      - id: create
        uses: actions/github-script@v7
        with:
          script: |
            const tag = process.env.TAG;
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `PCompare ${tag}`,
              draft: true,
              prerelease: tag.includes("-"),
              generate_release_notes: true,
            });
            return data.id;

  build:
    needs: [prepare, create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            rust-targets: ""
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust-targets }}
      - run: npm ci

      # Only export Apple credentials when they exist; an empty APPLE_CERTIFICATE
      # would make the bundler try (and fail) to import a certificate. Without
      # them the app is ad-hoc signed (see tauri.conf.json) and users approve it
      # once under System Settings → Privacy & Security.
      - name: Apple code signing (optional)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
              echo "$v=${!v}" >> "$GITHUB_ENV"
            done
            if [ -n "$APPLE_ID" ]; then
              for v in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do echo "$v=${!v}" >> "$GITHUB_ENV"; done
            fi
            echo "Developer ID signing enabled"
          else
            echo "No Apple certificate — building ad-hoc signed"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
          # Windows clients update through the NSIS installer (per-user, no UAC prompt).
          updaterJsonPreferNsis: true

  publish-release:
    needs: [prepare, create-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          TAG: ${{ needs.prepare.outputs.tag }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
              make_latest: process.env.TAG.includes("-") ? "false" : "true",
            });
