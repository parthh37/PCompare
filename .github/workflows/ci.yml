name: CI

on:
  push:
    branches: [main]
  pull_request:

# Rust caches are saved only from main. The repo has a 10 GB cache budget and
# each PR used to add ~3 GB of its own, evicting main's caches (including the
# ones releases restore from). PRs still restore main's caches.
jobs:
  core-tests:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test -p pcompare-core -p pcompare-remote -p pcompare-merge -p pcompare-table -p pcompare-picture -p pcompare-sync -p pcompare-meta -p pcompare-db -p pcompare-convert -p pcompare-report -p pcompare-script -p pcompare-archive -p pcompare-review

  app-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - run: npm run build
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Installable builds of every PR: the Windows NSIS installer and MSI (which
  # also compile the Explorer context-menu hooks.nsh / shell-menu.wxs) and an
  # Apple Silicon DMG.
  # Updater signing is switched off so PRs don't need the release key.
  bundles:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            platform: windows-latest
            args: --bundles nsis,msi
            target: ""
          - name: macos-apple-silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          # Shared with release.yml's matching build jobs (see there).
          shared-key: bundle-${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - run: npx tauri build ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
        shell: bash
        env:
          # Built-in cloud sign-in apps, as in release.yml (empty on forks).
          PCOMPARE_MICROSOFT_CLIENT_ID: ${{ vars.PCOMPARE_MICROSOFT_CLIENT_ID }}
          PCOMPARE_GOOGLE_CLIENT_ID: ${{ vars.PCOMPARE_GOOGLE_CLIENT_ID }}
          PCOMPARE_GOOGLE_CLIENT_SECRET: ${{ secrets.PCOMPARE_GOOGLE_CLIENT_SECRET }}
          PCOMPARE_DROPBOX_CLIENT_ID: ${{ vars.PCOMPARE_DROPBOX_CLIENT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: PCompare-${{ matrix.name }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
