[package]
name = "pcompare-core"
description = "Diff engines (text, folder, binary) powering PCompare"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
similar = "2"
regex = "1"
crc32fast = "1"
encoding_rs = "0.8"
# legacy/MBCS encoding auto-detection for text files
chardetng = "0.1"
globset = "0.4"
rayon = "1"
memchr = "2"
# exe/dll version compare (pure Rust, no mmap) and NFC/NFD name alignment
pelite = { version = "0.10.0", default-features = false, features = ["std"] }
unicode-normalization = "0.1"
# Sealed config files (vault.rs). Pure Rust, so the crate stays C-free.
aes-gcm = { version = "0.11", features = ["zeroize"] }

[dev-dependencies]
tempfile = "3"
