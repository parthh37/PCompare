[package]
name = "pcompare-convert"
description = "Document-to-text converters and file format rules for PCompare"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pcompare-core = { path = "../pcompare-core" }
serde.workspace = true
serde_json.workspace = true
encoding_rs = "0.8"
# Word / OpenDocument packages are zip archives of XML parts.
zip = { version = "8", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
# Word 97-2003 .doc files are OLE compound files.
cfb = "0.14"
# Pure-Rust PDF text extraction (lopdf underneath); the default features only
# add date/time parsing and parallel loading.
pdf-extract = { version = "0.12", default-features = false }

