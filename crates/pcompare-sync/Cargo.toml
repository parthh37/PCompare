[package]
name = "pcompare-sync"
description = "Folder sync and 3-way folder merge engines for PCompare"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pcompare-core = { path = "../pcompare-core" }
# automatic text merging in Folder Merge (pure Rust, no C deps)
pcompare-merge = { path = "../pcompare-merge" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
crc32fast = "1"
fs4 = "0.13"
filetime = "0.2"
globset = "0.4"
rayon = "1"
trash = "5"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
# Security / FileSystem / Threading: copy NTFS ACLs, 8.3 short names, DOS attributes
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_RestartManager", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
