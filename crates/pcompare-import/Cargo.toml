[package]
name = "pcompare-import"
description = "Imports saved sessions from other compare and sync tools into PCompare"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Read-only DOM over the tools' XML; pure Rust, no C deps.
roxmltree = "0.21"
# .bcpkg (Beyond Compare's settings export) is a zip.
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
