[package]
name = "pcompare-table"
description = "Table (CSV / TSV / Excel / HTML) comparison engine for PCompare"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pcompare-core = { path = "../pcompare-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
csv = "1"
calamine = "0.36"
# Already in the dependency graph through tauri-utils, so it adds no new crates.
dom_query = { version = "0.28", default-features = false }
similar = "2"

[dev-dependencies]
tempfile = "3"
rust_xlsxwriter = { version = "0.99", default-features = false }
