[package]
name = "pcompare-picture"
description = "Picture comparison engine for PCompare"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pcompare-core = { path = "../pcompare-core" }
serde.workspace = true
base64 = "0.22"
rayon = "1.10"
# Formats are listed explicitly to keep compile weight down; `rayon` enables
# parallel decoding in the codecs that support it.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "bmp",
    "ico",
    "tiff",
    "webp",
    "tga",
    "pnm",
    "qoi",
    "rayon",
] }

[dev-dependencies]
tempfile = "3"
